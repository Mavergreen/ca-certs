name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut -mavericks.(N+1) for the current NSS release"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Stage release artifacts out of tree
        run: echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"

      - name: Derive version and release plan
        id: ver
        env:
          LOCAL_RELEASE: ${{ inputs.local_release }}
          RECONCILE: ${{ inputs.reconcile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh build/derive-upstream-version.sh >/dev/null
          # spec: tests/release-workflow.sh -- release-mode.sh's contract only recognizes
          #       LOCAL_RELEASE/GITHUB_EVENT_NAME (tests/release-mode-test.sh); a reconcile=true
          #       dispatch must cut the same N+1 a human local_release=true dispatch would, so feed
          #       it the LOCAL_RELEASE=true its contract already understands rather than teach it a
          #       second, competing input.
          effective_local_release="$LOCAL_RELEASE"
          [ "$RECONCILE" = true ] && effective_local_release=true
          mode="$(LOCAL_RELEASE="$effective_local_release" sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          tag="$(printf '%s\n' "$out" | sed -n 's/^TAG=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          case "$GITHUB_EVENT_NAME" in
            push) [ "$GITHUB_REF" = refs/heads/main ] || rel=no ;;
            workflow_dispatch) : ;;
            *) rel=no ;;
          esac
          [ -n "$full" ] || { echo "::error::no version derived"; exit 1; }
          # spec: tests/release-workflow.sh -- a reconcile=true dispatch always lands in local mode
          #       above, so without this gate it would always cut N+1 even when a push-triggered
          #       release already published the exact declared state, double-cutting a release. A
          #       human local_release=true dispatch stays ungated: choosing that by hand IS the
          #       decision to publish.
          if [ "$rel" = yes ] && [ "$RECONCILE" = true ]; then
            digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
            answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
            case "$answer" in
              PUBLISH) : ;;
              *) rel=no ;;
            esac
          fi
          printf '%s\n' "$full" > VERSION
          publish=false; [ "$rel" = yes ] && publish=true
          { echo "full=$full"; echo "tag=$tag"; echo "release=$rel"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

      - name: Build the trust data
        run: sh build/build-bundle.sh

      - name: Build the universal updater
        run: |
          set -eu
          app="$(basename "$(sh "$SHIPYARD_SCRIPTS/product-name.sh" updater-app ca-certs)")"
          exe="$RUNNER_TEMP/$app/Contents/MacOS/${app%.app}"
          sh build/build-updater.sh "$RUNNER_TEMP/$app"
          archs="$(lipo -info "$exe")"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::updater is not universal: $archs"; exit 1;; esac

      - name: Package
        env:
          VER: ${{ steps.ver.outputs.full }}
        run: |
          set -eu
          app="$(basename "$(sh "$SHIPYARD_SCRIPTS/product-name.sh" updater-app ca-certs)")"
          sh build/package-pkg.sh --version "$VER" \
            --updater "$RUNNER_TEMP/$app" --out "$DIST"
          sh "$SHIPYARD_SCRIPTS/assert_pkg_installs_in_place.sh" "$DIST/ca-certs-$VER.pkg"

      - name: Run repo tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Generate release notes
        if: steps.ver.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.full }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$TAG" --version "$VER" \
            --product "CA Certificates" --min-os 10.9.5 --out "$DIST/RELEASE_NOTES.md"
          prev="$(sh "$SHIPYARD_SCRIPTS/previous-release-tag.sh" "$TAG")"
          if [ -n "$prev" ]; then
            gh release download "$prev" -p roots.txt -D "$RUNNER_TEMP/prev" \
              || { echo "::error::$prev has no roots.txt to compare with"; exit 1; }
            sh build/roots-notes.sh --append "$DIST/RELEASE_NOTES.md" "$DIST/roots.txt" "$RUNNER_TEMP/prev/roots.txt"
          else
            sh build/roots-notes.sh --append "$DIST/RELEASE_NOTES.md" "$DIST/roots.txt"
          fi
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$DIST/RELEASE_NOTES.md" --digest "$digest"

      - name: Sign the pkg and write the feed
        if: steps.ver.outputs.release == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.full }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          PKG="$DIST/ca-certs-$VER.pkg"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product ca-certs --feed-dir "$DIST" \
            --channel-title "CA Certificates for Mavericks" --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$(basename "$PKG")" \
            --notes-file "$DIST/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        env:
          REL: ${{ steps.ver.outputs.release }}
          VER: ${{ steps.ver.outputs.full }}
        run: |
          set -eu
          if [ "$REL" != yes ]; then
            sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$DIST" "$VER"
          fi
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$DIST" "$VER" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: Assert the feed upgrades installed clients
        if: steps.ver.outputs.release == 'yes'
        env:
          VER: ${{ steps.ver.outputs.full }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$DIST/ca-certs.xml" --version "$VER"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: ca-certs-dist
          path: ${{ env.DIST }}/*

  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'true')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: ca-certs-dist
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: ca-certs-dist
